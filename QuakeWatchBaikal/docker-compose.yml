services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: qwb_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: quakewatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quakewatch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qwb_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: rustfs/rustfs:latest
    container_name: qwb_minio
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin_password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_VOLUMES: "/data"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend:
    build: ./backend
    container_name: qwb_backend
    ports:
      - "8000:8000"
    #volumes:
    #  - "D:/data:/app/data"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:secret_password@db:5432/quakewatch
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super_secret_key_for_baikal_2026
      - DATA_DIR=/app/data
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin_password
      - S3_BUCKET=quakewatch-data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: qwb_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  miniodata:
